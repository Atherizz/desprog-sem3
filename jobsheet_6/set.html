<!DOCTYPE html>
<html>
<head>
    <script src="node_modules/jquery/dist/jquery.js"></script> 
    
    <script>
        $(document).ready(function() {
            // Tombol 1: Set Text
            $("#btn1").click(function() {
                // Menetapkan konten teks murni (tag <b> diabaikan)
                $("#test1").text("<b>Hello World</b>");
            });

            // Tombol 2: Set HTML
            $("#btn2").click(function() {
                // Menetapkan konten termasuk tag HTML (tag <b> akan diformat)
                $("#test2").html("<b>Hello World!</b>");
            });

            // Tombol 3: Set Value
            $("#btn3").click(function() {
                // Menetapkan nilai pada input teks
                $("#test3").val("Polinema");
            });
        });
    </script>
</head>
<body>
    <p id="test1">This is the first paragraph.</p>
    <p id="test2">This is <b>another</b> paragraph.</p>
    
    <p>Your Name: <input type="text" id="test3"/></p>
    
    <button id="btn1">Set Text</button>
    <button id="btn2">Set HTML</button>
    <button id="btn3">Set Value</button>
</body>
</html>
