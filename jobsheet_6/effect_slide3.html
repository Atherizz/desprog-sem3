<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" type="text/css" href="styleSlide.css"/>
    
    <script src="node_modules/jquery/dist/jquery.js"></script> 
    
    <script>
        $(document).ready(function() {
            // Saat div dengan ID "flip" diklik
            $("#flip").click(function() {
                // Toggle slide kotak2 (Jika tersembunyi, tampilkan. Jika terlihat, sembunyikan.)
                $("#kotak2").slideToggle("slow");
            });
        });
    </script>
</head>
<body>
    <div id="flip">Klik untuk Efek Slide</div>
    <div id="kotak2">Selamat Pagi</div>
</body>
</html>
