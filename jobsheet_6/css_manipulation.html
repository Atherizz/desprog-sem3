<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" type="text/css" href="styleCSS.css"/>
    
    <script src="node_modules/jquery/dist/jquery.js"></script> 
    
    <script>
        $(document).ready(function() {
            // Tombol 1: Add Classes
            $(".btn1").click(function() {
                // Tambahkan class 'blue' ke h1, h2, dan p
                $("h1, h2, p").addClass("blue");
                // Tambahkan class 'important' ke div
                $("div").addClass("important");
            });

            // Tombol 2: Remove Classes
            $(".btn2").click(function() {
                // Hapus class 'blue' dari h1, h2, dan p
                $("h1, h2, p").removeClass("blue");
            });

            // Tombol 3: Set CSS
            $(".btn3").click(function() {
                // Terapkan properti CSS langsung ke h1, h2, p, dan div
                $("h1, h2, p, div").css({
                    "background-color": "yellow",
                    "font-size": "100%"
                });
            });
        });
    </script>
</head>
<body>
    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <p>This is a paragraph.</p>
    <p>This is another paragraph.</p>
    <div>This is some important text!<br></div>
    
    <button class="btn1">Add classes to elements</button>
    <button class="btn2">Remove classes to elements</button>
    <button class="btn3">Set classes to elements</button>
</body>
</html>
