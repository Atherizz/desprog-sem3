<!DOCTYPE html>
<html>
<head>
    <link rel="stylesheet" type="text/css" href="style.css"/>
    
    <script src="node_modules/jquery/dist/jquery.js"></script> 
    
    <script>
        $(document).ready(function() {
            // Tombol 1: Sembunyikan Div
            $(".tombol1").click(function() {
                $("div").hide();
            });

            // Tombol 2: Tampilkan Div
            $(".tombol2").click(function() {
                $("div").show();
            });

            // Tombol 3: Fade Out (Menghilang secara bertahap)
            $(".tombol3").click(function() {
                $("#div1").fadeOut();
                $("#div2").fadeOut("slow");
                $("#div3").fadeOut(3000); // 3000 ms = 3 detik
            });

            // Tombol 4: Fade In (Muncul secara bertahap)
            $(".tombol4").click(function() {
                $("#div1").fadeIn();
                $("#div2").fadeIn("slow");
                $("#div3").fadeIn(3000); // 3000 ms = 3 detik
            });

            // Tombol 5: Fade To (Mengubah opacity)
            $(".tombol5").click(function() {
                $("#div1").fadeTo("slow", 0.15);
                $("#div2").fadeTo("slow", 0.4);
                $("#div3").fadeTo("slow", 0.7);
            });
        });
    </script>
</head>
<body>
    <p>jQuery Effect</p>
    
    <div id="div1" class="kotak"></div><br><br>
    <div id="div2" class="kotak"></div><br><br>
    <div id="div3" class="kotak"></div><br><br>
    
    <button class="tombol1">Sembunyikan</button>
    <button class="tombol2">Tampilkan</button>
    <button class="tombol3">Fade Out</button>
    <button class="tombol4">Fade In</button>
    <button class="tombol5">Fade To</button>
</body>
</html>
